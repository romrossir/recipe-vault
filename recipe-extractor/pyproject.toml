[project]
name = "recipe-extractor"
version = "0.1.0"
description = "OCR pipeline for extracting recipes from magazine PDFs and photos"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "onnxruntime>=1.18",
    "PyMuPDF>=1.25",
    "Pillow>=10.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.scripts]
recipe-extractor = "recipe_extractor.cli:cli"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
